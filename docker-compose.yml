# Single-command stack:
#   1. Mongo + Redis become healthy
#   2. OmniRoute (local LLM gateway) starts
#   3. Backend boots (lifespan seeds indexes/RBAC/org/Learning) and becomes healthy
#   4. Frontend starts (waits for backend)
#
#   cp .env.docker.example .env
#   docker compose up --build -d
#   # wait ~1-2 min while images build + mongo/redis index + backend lifespan seed
#   docker compose exec backend python -m scripts.seed_super_admin
#   # UI:        http://localhost:3000
#   # API docs:  http://localhost:8000/docs
#   # OmniRoute: http://localhost:20128  (dashboard → Providers → add keys/models)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand({ping:1})\" --quiet"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  redis:
    # backend/ has no Redis client code today; REDIS_URL is only required to
    # satisfy config validation. Kept so the env var resolves inside the container.
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    environment:
      - PORT=20128
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      # Node is present in the base image; dashboard root returns 200 on boot.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:20128/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    ports:
      - "20128:20128"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env                       # your real Atlas/SMTP/Cloudinary/Gemini/OmniRoute/secrets config
    environment:
      # Network-specific overrides so services reachable inside Docker map correctly.
      # (env_file values above win for everything else.)
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      DATABASE_NAME: Talent
      REDIS_URL: redis://redis:6379
      OPENROUTER_BASE_URL: http://omniroute:20128/v1/chat/completions
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      omniroute:
        condition: started      # AI agent degrades gracefully if OmniRoute is still warming up
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 24
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  redis-data:
  omniroute-data:
